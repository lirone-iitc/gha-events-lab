name: Events, Filtering & Conditions

on:
  push:
    paths:
      - 'src/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - staging
          - production
        required: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  pr-check:
    name: PR check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Print PR title
        run: echo "PR check running for: ${{ github.event.pull_request.title }}"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  manual-info:
    name: Manual dispatch info
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Print target environment
        run: echo "Deploying to: ${{ github.event.inputs.environment }}"
